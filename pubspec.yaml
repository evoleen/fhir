name: fhir
description: FHIR library of versions R4, STU3, DSTU2, and R5 (draft) for Dart & Flutter.
version: 0.12.1
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  freezed_annotation: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  xml2json: ^6.2.7
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^3.0.6
  # dart run import_sorter:main
  import_sorter: ^4.6.0
  json_serializable: ^6.9.5
  test: ^1.26.2
